name: Release

# Push a tag like v1.0.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install
        run: python -m pip install ".[gui,heic,dev]"
      - name: Test
        run: pytest
      - name: Build
        run: python scripts/build.py --zip metadata-stripper-${{ matrix.name }}
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/metadata-stripper-${{ matrix.name }}.zip
          generate_release_notes: true

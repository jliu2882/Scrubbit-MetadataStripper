[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metadata-stripper"
version = "1.0.0"
description = "See and remove hidden metadata (GPS, device serials, timestamps) from images before you share them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["privacy", "exif", "metadata", "gps", "images"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Security",
]
dependencies = ["Pillow>=10.0", "piexif>=1.1.3"]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pyinstaller>=6"]

[project.scripts]
metastrip = "metastrip.cli.main:main"
metastrip-gui = "metastrip.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["metastrip"]
omit = ["*/gui/*", "*/__main__.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
